<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Tasks - Dynamic Workspace</title>
  <!-- Google Fonts: Inter and Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
  <!-- Ambient background glow elements for Glassmorphic effect -->
  <div class="glow-bg">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
    <div class="glow-circle glow-3"></div>
  </div>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 12 2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
        </div>
        <h1>Zenith <span>Tasks</span></h1>
      </div>
      <div class="header-actions">
        <!-- Theme Toggle -->
        <button id="export-data" class="btn-icon" aria-label="Export Tasks" title="Export Tasks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button id="import-data" class="btn-icon" aria-label="Import Tasks" title="Import Tasks">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </button>
        <input type="file" id="import-file-input" style="display: none;" accept=".json">
        
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle Theme">
          <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button id="open-add-modal" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          <span>New Task</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <!-- Sidebar / Statistics -->
      <aside class="sidebar-panel">
        <div class="panel-card stats-card">
          <h3>Progress Dashboard</h3>
          <div class="progress-container">
            <div class="progress-ring-box">
              <svg class="progress-ring" width="120" height="120">
                <circle class="progress-ring__circle-bg" stroke="var(--border-color)" stroke-width="10" fill="transparent" r="50" cx="60" cy="60" />
                <circle class="progress-ring__circle" id="progress-circle" stroke="url(#progress-gradient)" stroke-width="10" fill="transparent" r="50" cx="60" cy="60" />
                <defs>
                  <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="var(--gradient-start)" />
                    <stop offset="100%" stop-color="var(--gradient-end)" />
                  </linearGradient>
                </defs>
              </svg>
              <div class="progress-text" id="progress-percent">0%</div>
            </div>
            <div class="stats-text">
              <p><strong id="completed-count">0</strong> of <strong id="total-count">0</strong> tasks completed</p>
            </div>
          </div>
          <div class="stats-breakdown">
            <div class="stat-item active">
              <div class="stat-value" id="active-count">0</div>
              <div class="stat-label">Active</div>
            </div>
            <div class="stat-item completed">
              <div class="stat-value" id="stat-completed-count">0</div>
              <div class="stat-label">Completed</div>
            </div>
          </div>
        </div>

        <div class="panel-card categories-card">
          <h3>Categories</h3>
          <ul class="category-list" id="category-filter-list">
            <!-- Dynamically populated categories -->
          </ul>
        </div>

        <div class="panel-card pomodoro-card">
          <h3>Pomodoro Timer</h3>
          <div class="pomodoro-display">
            <span id="pomodoro-time">25:00</span>
          </div>
          <div class="pomodoro-controls">
            <button id="pomodoro-start" class="btn btn-primary btn-sm">Start</button>
            <button id="pomodoro-reset" class="btn btn-secondary btn-sm">Reset</button>
          </div>
          <p class="pomodoro-status" id="pomodoro-status">Ready to focus?</p>
        </div>
      </aside>

      <!-- Task Operations & Board -->
      <section class="board-panel">
        <!-- Controls Bar -->
        <div class="controls-bar">
          <!-- Search input -->
          <div class="search-box">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" id="search-input" placeholder="Search tasks by title or description...">
            <button id="voice-search-btn" class="clear-btn" aria-label="Voice Search" title="Voice Search" style="right: 40px; display: flex;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </button>
            <button id="clear-search" class="clear-btn" aria-label="Clear search" style="display: none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
          </div>

          <!-- Filter & Sort Sub-bar -->
          <div class="filters-row">
            <div class="tabs" id="status-tabs">
              <button class="tab-btn active" data-tab="all">All</button>
              <button class="tab-btn" data-tab="active">Active</button>
              <button class="tab-btn" data-tab="completed">Completed</button>
            </div>

            <div class="selectors">
              <!-- Priority Filter -->
              <select id="priority-filter" class="form-select">
                <option value="all">All Priorities</option>
                <option value="high">🔴 High</option>
                <option value="medium">🟡 Medium</option>
                <option value="low">🟢 Low</option>
              </select>

              <!-- Sort Select -->
              <select id="sort-select" class="form-select">
                <option value="createdAt-desc">Newest First</option>
                <option value="createdAt-asc">Oldest First</option>
                <option value="dueDate-asc">Due Date (Soonest)</option>
                <option value="dueDate-desc">Due Date (Latest)</option>
                <option value="priority-desc">Priority (High to Low)</option>
                <option value="priority-asc">Priority (Low to High)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Kanban Board Area -->
        <div id="tasks-container" class="kanban-board">
          <div class="kanban-column" data-status="todo">
            <h3 class="kanban-header">To Do <span class="kanban-count">0</span></h3>
            <div class="kanban-dropzone" id="col-todo"></div>
            <form id="quick-add-form" class="quick-add-container">
              <input type="text" id="quick-add-input" placeholder="+ Add a task..." required autocomplete="off">
            </form>
          </div>
          <div class="kanban-column" data-status="in-progress">
            <h3 class="kanban-header">In Progress <span class="kanban-count">0</span></h3>
            <div class="kanban-dropzone" id="col-in-progress"></div>
          </div>
          <div class="kanban-column" data-status="done">
            <h3 class="kanban-header">Done <span class="kanban-count">0</span></h3>
            <div class="kanban-dropzone" id="col-done"></div>
          </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display: none;">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          </div>
          <h3>No tasks found</h3>
          <p>Try refining your filters, search terms, or create a new task to get started.</p>
          <button id="empty-create-btn" class="btn btn-secondary">Create a Task</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal for Creating/Editing Tasks -->
  <div id="task-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content glassmorphism">
      <div class="modal-header">
        <h2 id="modal-title">Create Task</h2>
        <button id="close-modal" class="btn-icon" aria-label="Close modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <form id="task-form" class="modal-form" novalidate>
        <input type="hidden" id="task-id">
        
        <div class="form-group">
          <label for="task-title-input">Title <span class="required">*</span></label>
          <input type="text" id="task-title-input" class="form-input" placeholder="What needs to be done?" required max="100">
          <span class="error-message" id="title-error">Title is required.</span>
        </div>

        <div class="form-group">
          <label for="task-desc-input">Description</label>
          <textarea id="task-desc-input" class="form-input" placeholder="Add more details about this task..." rows="3"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="task-category-input">Category</label>
            <input type="text" id="task-category-input" class="form-input" placeholder="e.g. Work, Personal" list="category-suggestions">
            <datalist id="category-suggestions">
              <option value="Work">
              <option value="Personal">
              <option value="Shopping">
              <option value="Health">
              <option value="Finance">
            </datalist>
          </div>

          <div class="form-group">
            <label for="task-priority-input">Priority</label>
            <select id="task-priority-input" class="form-select">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-duedate-input">Due Date</label>
          <input type="date" id="task-duedate-input" class="form-input">
        </div>

        <div class="modal-footer">
          <button type="button" id="cancel-task-btn" class="btn btn-tertiary">Cancel</button>
          <button type="submit" id="save-task-btn" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="app.js" defer></script>
</body>
</html>
